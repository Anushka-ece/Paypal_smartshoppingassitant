name: CI/CD Pipeline

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]

jobs:
  backend-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Initialize test schema
        working-directory: project_ver_1/backend
        run: alembic upgrade head
      - name: Run Tests
        run: |
          python -m pytest project_ver_1/backend/tests/ -q

  frontend-check:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: project_ver_1/frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: npm install
      - run: npm run typecheck
      - run: npm run build
